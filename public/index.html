<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Code Storage & Loadstring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #64ffda;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
            font-size: 2.5rem;
        }
        .subtitle {
            text-align: center;
            color: #8899aa;
            margin-bottom: 30px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .card h2 {
            color: #64ffda;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #b0b0b0;
            font-weight: 500;
        }
        .input-group textarea,
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: 'Consolas', monospace;
            transition: all 0.3s;
        }
        .input-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .input-group textarea:focus,
        .input-group input:focus {
            outline: none;
            border-color: #64ffda;
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.1);
        }
        .btn {
            background: linear-gradient(135deg, #64ffda, #00bcd4);
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(100, 255, 218, 0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef5350, #c62828);
            color: white;
        }
        .btn-danger:hover {
            box-shadow: 0 5px 20px rgba(239, 83, 80, 0.3);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #78909c, #546e7a);
            color: white;
        }
        .btn-success {
            background: linear-gradient(135deg, #66bb6a, #2e7d32);
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #42a5f5, #1565c0);
            color: white;
        }
        .output {
            margin-top: 15px;
            position: relative;
        }
        .output textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #64ffda;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            resize: vertical;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(100, 255, 218, 0.2);
            border: 1px solid #64ffda;
            color: #64ffda;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .copy-btn:hover {
            background: rgba(100, 255, 218, 0.3);
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
        .status.success {
            display: block;
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid #64ffda;
            color: #64ffda;
        }
        .status.error {
            display: block;
            background: rgba(239, 83, 80, 0.1);
            border: 1px solid #ef5350;
            color: #ef5350;
        }
        .status.info {
            display: block;
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid #2196f3;
            color: #2196f3;
        }
        .code-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .code-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #64ffda;
            cursor: pointer;
            transition: all 0.3s;
        }
        .code-item:hover {
            background: rgba(100, 255, 218, 0.05);
            transform: translateX(5px);
        }
        .code-item .name {
            color: #64ffda;
            font-weight: bold;
            font-size: 16px;
        }
        .code-item .id {
            color: #8899aa;
            font-size: 12px;
            font-family: monospace;
        }
        .code-item .desc {
            color: #b0b0b0;
            font-size: 14px;
            margin-top: 5px;
        }
        .code-item .stats {
            color: #8899aa;
            font-size: 12px;
            margin-top: 8px;
        }
        .code-item .stats span {
            margin-right: 15px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #64ffda;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #8899aa;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #64ffda;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00bcd4;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }
        .badge-info {
            background: rgba(33, 150, 243, 0.2);
            color: #2196f3;
        }
        .badge-success {
            background: rgba(100, 255, 218, 0.2);
            color: #64ffda;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Lua Code Storage</h1>
        <p class="subtitle">Lưu trữ, mã hóa và tạo loadstring cho code Lua của bạn</p>

        <div class="grid-2">
            <!-- Left Column -->
            <div>
                <!-- Save Code -->
                <div class="card">
                    <h2>💾 Lưu code mới</h2>
                    <div class="input-group">
                        <label>Tên code:</label>
                        <input type="text" id="codeName" placeholder="Nhập tên code...">
                    </div>
                    <div class="input-group">
                        <label>Mô tả:</label>
                        <input type="text" id="codeDesc" placeholder="Mô tả ngắn về code...">
                    </div>
                    <div class="input-group">
                        <label>Code Lua:</label>
                        <textarea id="codeInput" placeholder="-- Nhập code Lua của bạn ở đây..."></textarea>
                    </div>
                    <button class="btn" onclick="saveCode()" id="saveBtn">💾 Lưu code</button>
                    <button class="btn btn-secondary" onclick="clearCode()">🗑️ Xóa</button>
                    <button class="btn btn-secondary" onclick="loadExample()">📝 Ví dụ</button>
                    <div id="saveStatus" class="status"></div>
                </div>

                <!-- Result -->
                <div class="card" id="resultCard" style="display: none;">
                    <h2>✅ Kết quả</h2>
                    <div class="input-group">
                        <label>Loadstring:</label>
                        <div class="output">
                            <textarea id="loadstringOutput" readonly></textarea>
                            <button class="copy-btn" onclick="copyLoadstring()">📋 Copy</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Script đã mã hóa:</label>
                        <div class="output">
                            <textarea id="scriptOutput" readonly></textarea>
                            <button class="copy-btn" onclick="copyScript()">📋 Copy</button>
                        </div>
                    </div>
                    <button class="btn btn-success" onclick="downloadScript()">💾 Tải script</button>
                    <button class="btn btn-secondary" onclick="clearResult()">🗑️ Xóa</button>
                </div>
            </div>

            <!-- Right Column -->
            <div>
                <!-- List Codes -->
                <div class="card">
                    <h2>📋 Danh sách code</h2>
                    <div style="margin-bottom: 15px;">
                        <button class="btn btn-primary" onclick="loadCodeList()">🔄 Tải danh sách</button>
                        <span id="totalCodes" style="color: #8899aa; margin-left: 10px;"></span>
                    </div>
                    <div id="codeList" class="code-list">
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>Chưa có code nào được lưu</p>
                            <p style="font-size: 12px;">Hãy lưu code đầu tiên của bạn!</p>
                        </div>
                    </div>
                </div>

                <!-- Quick Load -->
                <div class="card">
                    <h2>🔗 Tải code bằng ID</h2>
                    <div class="input-group">
                        <label>Nhập ID code:</label>
                        <input type="text" id="loadIdInput" placeholder="Ví dụ: ABC12345">
                    </div>
                    <button class="btn btn-primary" onclick="loadCodeById()">📥 Tải code</button>
                    <div id="loadStatus" class="status"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ Save Code ============
        async function saveCode() {
            const name = document.getElementById('codeName').value || 'Không tên';
            const description = document.getElementById('codeDesc').value || '';
            const code = document.getElementById('codeInput').value;

            if (!code.trim()) {
                showSaveStatus('Vui lòng nhập code Lua!', 'error');
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Đang lưu...';

            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, code })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('loadstringOutput').value = data.loadstring;
                    document.getElementById('scriptOutput').value = data.script;
                    document.getElementById('resultCard').style.display = 'block';
                    showSaveStatus(`✅ Lưu thành công! ID: ${data.id}`, 'success');
                    loadCodeList();
                } else {
                    showSaveStatus('❌ Lỗi: ' + data.error, 'error');
                }
            } catch (error) {
                showSaveStatus('❌ Lỗi kết nối server: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '💾 Lưu code';
            }
        }

        function showSaveStatus(message, type) {
            const status = document.getElementById('saveStatus');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        // ============ Load Code List ============
        async function loadCodeList() {
            try {
                const response = await fetch('/api/list');
                const data = await response.json();
                
                const listDiv = document.getElementById('codeList');
                const totalSpan = document.getElementById('totalCodes');

                if (data.success && data.total > 0) {
                    totalSpan.textContent = `(Tổng: ${data.total} code)`;
                    listDiv.innerHTML = data.codes.map(item => `
                        <div class="code-item" onclick="viewCode('${item.id}')">
                            <div class="name">
                                ${item.name}
                                <span class="badge badge-info">${item.id}</span>
                                <span class="badge badge-success">${item.size} chars</span>
                            </div>
                            ${item.description ? `<div class="desc">${item.description}</div>` : ''}
                            <div class="stats">
                                <span>👁️ ${item.views || 0} views</span>
                                <span>⬇️ ${item.downloads || 0} downloads</span>
                                <span>📅 ${new Date(item.createdAt).toLocaleDateString()}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    totalSpan.textContent = '(Trống)';
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>Chưa có code nào được lưu</p>
                            <p style="font-size: 12px;">Hãy lưu code đầu tiên của bạn!</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Lỗi load list:', error);
                document.getElementById('codeList').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>Lỗi tải danh sách</p>
                        <p style="font-size: 12px;">${error.message}</p>
                    </div>
                `;
            }
        }

        // ============ View Code ============
        async function viewCode(id) {
            try {
                const response = await fetch(`/api/code/${id}`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('codeInput').value = data.code.code;
                    document.getElementById('codeName').value = data.code.name;
                    document.getElementById('codeDesc').value = data.code.description || '';
                    
                    // Tạo loadstring
                    const baseUrl = window.location.origin;
                    const loadstring = `loadstring(game:HttpGet("${baseUrl}/api/raw/${id}", true))()`;
                    document.getElementById('loadstringOutput').value = loadstring;
                    document.getElementById('scriptOutput').value = data.code.script;
                    document.getElementById('resultCard').style.display = 'block';
                    
                    showSaveStatus(`✅ Đã tải code: ${data.code.name}`, 'success');
                }
            } catch (error) {
                alert('Lỗi tải code: ' + error.message);
            }
        }

        // ============ Load Code By ID ============
        async function loadCodeById() {
            const id = document.getElementById('loadIdInput').value.trim();
            if (!id) {
                showLoadStatus('Vui lòng nhập ID code!', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/code/${id}`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('codeInput').value = data.code.code;
                    document.getElementById('codeName').value = data.code.name;
                    document.getElementById('codeDesc').value = data.code.description || '';
                    
                    const baseUrl = window.location.origin;
                    const loadstring = `loadstring(game:HttpGet("${baseUrl}/api/raw/${id}", true))()`;
                    document.getElementById('loadstringOutput').value = loadstring;
                    document.getElementById('scriptOutput').value = data.code.script;
                    document.getElementById('resultCard').style.display = 'block';
                    
                    showLoadStatus(`✅ Đã tải code: ${data.code.name}`, 'success');
                    loadCodeList();
                } else {
                    showLoadStatus('❌ Không tìm thấy code với ID này', 'error');
                }
            } catch (error) {
                showLoadStatus('❌ Lỗi: ' + error.message, 'error');
            }
        }

        function showLoadStatus(message, type) {
            const status = document.getElementById('loadStatus');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        // ============ Copy Functions ============
        function copyLoadstring() {
            const output = document.getElementById('loadstringOutput');
            output.select();
            document.execCommand('copy');
            alert('✅ Đã copy loadstring!');
        }

        function copyScript() {
            const output = document.getElementById('scriptOutput');
            output.select();
            document.execCommand('copy');
            alert('✅ Đã copy script!');
        }

        // ============ Download ============
        function downloadScript() {
            const script = document.getElementById('scriptOutput').value;
            if (!script) {
                alert('Không có script để tải!');
                return;
            }
            const blob = new Blob([script], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'script.lua';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ============ Utilities ============
        function loadExample() {
            document.getElementById('codeInput').value = `-- Ví dụ code Lua
print("Hello World!")

local function add(a, b)
    return a + b
end

local result = add(10, 20)
print("Kết quả: " .. result)

-- Game script
game.Players.PlayerAdded:Connect(function(player)
    print(player.Name .. " đã vào game!")
end)`;
            document.getElementById('codeName').value = 'Ví dụ code';
            document.getElementById('codeDesc').value = 'Đây là code ví dụ';
        }

        function clearCode() {
            document.getElementById('codeInput').value = '';
            document.getElementById('codeName').value = '';
            document.getElementById('codeDesc').value = '';
            document.getElementById('saveStatus').className = 'status';
            document.getElementById('saveStatus').textContent = '';
        }

        function clearResult() {
            document.getElementById('loadstringOutput').value = '';
            document.getElementById('scriptOutput').value = '';
            document.getElementById('resultCard').style.display = 'none';
        }

        // ============ Auto Load ============
        loadCodeList();

        // Refresh list every 30 seconds
        setInterval(loadCodeList, 30000);
    </script>
</body>
</html>
