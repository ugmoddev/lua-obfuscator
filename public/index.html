<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Code Encoder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #64ffda;
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.3);
            font-size: 2.5rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .card h2 {
            color: #64ffda;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #b0b0b0;
            font-weight: 500;
        }
        .input-group textarea,
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: 'Consolas', monospace;
            transition: all 0.3s;
        }
        .input-group textarea {
            min-height: 200px;
            resize: vertical;
        }
        .input-group textarea:focus,
        .input-group input:focus {
            outline: none;
            border-color: #64ffda;
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.1);
        }
        .btn {
            background: linear-gradient(135deg, #64ffda, #00bcd4);
            color: #1e1e2f;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(100, 255, 218, 0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #78909c, #546e7a);
        }
        .btn-secondary:hover {
            box-shadow: 0 5px 20px rgba(120, 144, 156, 0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef5350, #c62828);
        }
        .btn-danger:hover {
            box-shadow: 0 5px 20px rgba(239, 83, 80, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #66bb6a, #2e7d32);
        }
        .btn-success:hover {
            box-shadow: 0 5px 20px rgba(102, 187, 106, 0.3);
        }
        .output {
            margin-top: 15px;
            position: relative;
        }
        .output textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #64ffda;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            resize: vertical;
        }
        .output textarea:focus {
            outline: none;
            border-color: #64ffda;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(100, 255, 218, 0.2);
            border: 1px solid #64ffda;
            color: #64ffda;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .copy-btn:hover {
            background: rgba(100, 255, 218, 0.3);
        }
        .file-upload {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-upload:hover {
            border-color: #64ffda;
            background: rgba(100, 255, 218, 0.05);
        }
        .file-upload input[type="file"] {
            display: none;
        }
        .file-upload .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .file-upload .file-name {
            color: #64ffda;
            margin-top: 10px;
            font-weight: 500;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
        .status.success {
            display: block;
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid #64ffda;
            color: #64ffda;
        }
        .status.error {
            display: block;
            background: rgba(239, 83, 80, 0.1);
            border: 1px solid #ef5350;
            color: #ef5350;
        }
        .status.info {
            display: block;
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid #2196f3;
            color: #2196f3;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #64ffda;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        .stat-item span {
            color: #64ffda;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
            .stats {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Lua Code Encoder</h1>

        <!-- Upload File -->
        <div class="card">
            <h2>📤 Upload File Lua</h2>
            <div class="file-upload" id="fileDropZone">
                <div class="icon">📁</div>
                <p>Kéo thả file Lua hoặc click để chọn</p>
                <p style="font-size: 12px; color: #888; margin-top: 5px;">Hỗ trợ: .lua, .txt (tối đa 10MB)</p>
                <input type="file" id="fileInput" accept=".lua,.txt">
                <div class="file-name" id="fileName"></div>
            </div>
            <div id="fileStatus" class="status"></div>
            <div style="margin-top: 15px;">
                <button class="btn" onclick="uploadFile()" id="uploadBtn">🚀 Mã hóa file</button>
            </div>
        </div>

        <!-- Encode Code -->
        <div class="card">
            <h2>✏️ Mã hóa code Lua</h2>
            <div class="input-group">
                <label>Nhập code Lua:</label>
                <textarea id="codeInput" placeholder="-- Nhập code Lua của bạn ở đây..."></textarea>
            </div>
            <button class="btn" onclick="encodeCode()" id="encodeBtn">🔐 Mã hóa</button>
            <button class="btn btn-secondary" onclick="clearCode()">🗑️ Xóa</button>
            <button class="btn btn-secondary" onclick="loadExample()">📝 Ví dụ</button>
        </div>

        <!-- Generate Loadstring -->
        <div class="card">
            <h2>🔗 Tạo Loadstring</h2>
            <div class="input-group">
                <label>URL file Lua:</label>
                <input type="text" id="urlInput" placeholder="https://example.com/script.lua">
            </div>
            <button class="btn" onclick="generateLoadstring()" id="loadstringBtn">⚡ Tạo Loadstring</button>
        </div>

        <!-- Output -->
        <div class="card" id="outputCard" style="display: none;">
            <h2>📋 Kết quả</h2>
            <div class="output">
                <textarea id="outputText" readonly></textarea>
                <button class="copy-btn" onclick="copyOutput()">📋 Copy</button>
            </div>
            <div class="stats" id="stats"></div>
            <div style="margin-top: 15px;">
                <button class="btn btn-success" onclick="downloadOutput()">💾 Tải xuống</button>
                <button class="btn btn-danger" onclick="clearOutput()">🗑️ Xóa</button>
            </div>
        </div>
    </div>

    <script>
        // File upload handling
        const dropZone = document.getElementById('fileDropZone');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#64ffda';
            dropZone.style.background = 'rgba(100, 255, 218, 0.05)';
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            dropZone.style.background = 'transparent';
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            dropZone.style.background = 'transparent';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            const validTypes = ['.lua', '.txt'];
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            if (!validTypes.includes(ext)) {
                showStatus('Vui lòng chọn file .lua hoặc .txt!', 'error');
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                showStatus('File quá lớn! Tối đa 10MB.', 'error');
                return;
            }
            selectedFile = file;
            fileName.textContent = '📄 ' + file.name + ' (' + (file.size / 1024).toFixed(2) + ' KB)';
            showStatus('Đã chọn file: ' + file.name, 'success');
        }

        function showStatus(message, type) {
            const status = document.getElementById('fileStatus');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        async function uploadFile() {
            if (!selectedFile) {
                showStatus('Vui lòng chọn file trước!', 'error');
                return;
            }

            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Đang xử lý...';

            const formData = new FormData();
            formData.append('luaFile', selectedFile);

            try {
                showStatus('Đang mã hóa...', 'info');
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('outputText').value = data.encoded;
                    document.getElementById('outputCard').style.display = 'block';
                    document.getElementById('stats').innerHTML = `
                        <div class="stat-item">📁 File: <span>${data.filename}</span></div>
                        <div class="stat-item">📏 Dung lượng: <span>${(data.size / 1024).toFixed(2)} KB</span></div>
                        <div class="stat-item">🔐 Đã mã hóa thành công</div>
                    `;
                    showStatus('✅ Mã hóa thành công!', 'success');
                } else {
                    showStatus('❌ Lỗi: ' + data.error, 'error');
                }
            } catch (error) {
                showStatus('❌ Lỗi kết nối server: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 Mã hóa file';
            }
        }

        async function encodeCode() {
            const code = document.getElementById('codeInput').value;
            if (!code.trim()) {
                alert('Vui lòng nhập code Lua!');
                return;
            }

            const btn = document.getElementById('encodeBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Đang mã hóa...';

            try {
                const response = await fetch('/encode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('outputText').value = data.encoded;
                    document.getElementById('outputCard').style.display = 'block';
                    document.getElementById('stats').innerHTML = `
                        <div class="stat-item">📝 Code gốc: <span>${data.originalLength} ký tự</span></div>
                        <div class="stat-item">🔐 Code mã hóa: <span>${data.encodedLength} ký tự</span></div>
                        <div class="stat-item">📈 Tỉ lệ: <span>${(data.encodedLength / data.originalLength * 100).toFixed(1)}%</span></div>
                    `;
                } else {
                    alert('❌ Lỗi: ' + data.error);
                }
            } catch (error) {
                alert('❌ Lỗi kết nối server: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔐 Mã hóa';
            }
        }

        async function generateLoadstring() {
            const url = document.getElementById('urlInput').value;
            if (!url.trim()) {
                alert('Vui lòng nhập URL!');
                return;
            }

            const btn = document.getElementById('loadstringBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Đang tạo...';

            try {
                const response = await fetch('/generate-loadstring', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('outputText').value = data.loadstring;
                    document.getElementById('outputCard').style.display = 'block';
                    document.getElementById('stats').innerHTML = `
                        <div class="stat-item">🔗 URL: <span>${data.url}</span></div>
                        <div class="stat-item">⚡ Loadstring đã tạo</div>
                    `;
                } else {
                    alert('❌ Lỗi: ' + data.error);
                }
            } catch (error) {
                alert('❌ Lỗi kết nối server: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '⚡ Tạo Loadstring';
            }
        }

        function loadExample() {
            document.getElementById('codeInput').value = `-- Ví dụ code Lua
print("Hello World!")

local function add(a, b)
    return a + b
end

local result = add(10, 20)
print("Kết quả: " .. result)

-- Game script
game.Players.PlayerAdded:Connect(function(player)
    print(player.Name .. " đã vào game!")
end)`;
        }

        function copyOutput() {
            const output = document.getElementById('outputText');
            output.select();
            document.execCommand('copy');
            alert('✅ Đã copy kết quả!');
        }

        function downloadOutput() {
            const output = document.getElementById('outputText').value;
            if (!output) {
                alert('Không có dữ liệu để tải!');
                return;
            }
            const blob = new Blob([output], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'encoded_script.lua';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function clearCode() {
            document.getElementById('codeInput').value = '';
        }

        function clearOutput() {
            document.getElementById('outputText').value = '';
            document.getElementById('outputCard').style.display = 'none';
            document.getElementById('stats').innerHTML = '';
        }

        // Check server health
        async function checkHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                console.log('✅ Server OK:', data);
            } catch (error) {
                console.warn('⚠️ Server health check failed:', error.message);
            }
        }
        checkHealth();
        setInterval(checkHealth, 60000); // Check every minute
    </script>
</body>
</html>
